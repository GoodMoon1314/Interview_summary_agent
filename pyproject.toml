[project]
name = "interview-summary-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # LangChain / LangGraph 核心
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "langsmith>=0.2.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-deepseek>=1.1.0",
    "dashscope>=1.27.5",
    "ipython>=9.17.1",
    "ipykernel>=7.3.0",
    "faiss-cpu>=1.15.1",
    "langgraph-cli[inmem]>=0.4.31",
    "langchain-tavily>=0.2.18",
    "fastapi>=0.141.1",
    "booktype>=1.5",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
